[workspace]
members = ["."]
resolver = "3"

[package]
name = "nds-source"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync"
description = "Public NDS source catalog validation and component dispatch"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
jsonschema = { version = "=0.60.2", default-features = false }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "macros", "process", "time", "io-util"] }
url = "=2.5.8"
tempfile = "=3.27.0"

[build-dependencies]
sha2 = "=0.11.1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
