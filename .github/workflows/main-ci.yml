name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.1'
          python-version-file: .python-version
          enable-cache: 'false'
      - run: just setup
      - name: Install the pinned compiler for actual shared-cache acceptance
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/nds-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Validate standards and module catalog
        run: just check
      - name: Verify public recursive checkout without component credentials
        run: |
          git -c credential.helper= -c protocol.file.allow=never submodule update --init --recursive --jobs 2
          test -z "$(git submodule status --recursive | sed -n '/^[+U-]/p')"

  workflows:
    # Workflow lint and audit plus the secret scan: new commits on pull requests,
    # the full history on main (STD-0004 library tools, verified prebuilt binaries).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi
