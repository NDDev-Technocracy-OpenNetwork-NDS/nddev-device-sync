name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.1'
          python-version-file: .python-version
          enable-cache: 'false'
      - run: just setup
      - name: Install the pinned compiler for actual shared-cache acceptance
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/nds-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Validate standards and module catalog
        run: just check
      - name: Verify public recursive checkout without component credentials
        run: |
          git -c credential.helper= -c protocol.file.allow=never submodule update --init --recursive --jobs 2
          test -z "$(git submodule status --recursive | sed -n '/^[+U-]/p')"
