name: main-ci

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: source-root-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 30 }}
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    permissions:
      contents: read
    steps:
      # Cargo-cache acceptance deliberately uses an isolated installed SDK.
      - name: Isolate the existing fixture toolchain
        run: printf 'RUSTUP_HOME=%s/nds-rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare the source-root job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: false
          fetch-depth: 0
          python-version: '3.15.2'
          rust-version: '1.100.0'
          rust-components: rustfmt,clippy
      - name: Check the source root and real tooling behavior
        id: project
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          just setup
          if [ "$EVENT" = pull_request ]; then
            just check
            just test
          else
            just verify
          fi
      - name: Complete source-root qualification
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: ${{ github.event_name == 'pull_request' && 'short check' || 'full check' }}
          task-type: test
          name: quality
          read-token: ${{ steps.setup.outputs.read-token }}

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    with:
      hosted-runner: ubuntu-26.04
    permissions:
      contents: read
