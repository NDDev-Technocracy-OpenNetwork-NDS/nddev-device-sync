name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Install the pinned compiler for actual shared-cache acceptance
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/nds-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Check source contracts and tooling behavior
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: verify
      - name: Verify public recursive checkout without component credentials
        run: |
          git -c credential.helper= -c protocol.file.allow=never submodule update --init --recursive --jobs 2
          test -z "$(git submodule status --recursive | sed -n '/^[+U-]/p')"


  merge-stops:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    with:
      hosted-runner: ubuntu-26.04
