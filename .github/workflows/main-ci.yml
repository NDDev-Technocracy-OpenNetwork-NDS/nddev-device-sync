name: main-ci

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: source-root-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 30 }}
    permissions:
      contents: read
    steps:
      - name: Read the root toolchain declaration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the root compiler in an isolated Rustup home
        id: fixture-toolchain
        shell: python3 {0}
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          with Path("rust-toolchain.toml").open("rb") as source:
              channel = tomllib.load(source)["toolchain"]["channel"]
          if not isinstance(channel, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", channel):
              raise ValueError("The source root requires an exact Rust release")
          home = Path(os.environ["RUNNER_TEMP"]) / "nds-rustup"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"RUSTUP_HOME={home}\nRUSTUP_TOOLCHAIN={channel}\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")
      - name: Prepare the source-root job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          managed: false
          fetch-depth: 0
          python-version: '3.15.2'
          rust-version: ${{ steps.fixture-toolchain.outputs.channel }}
          rust-components: rustfmt,clippy
      - name: Check the source root and real tooling behavior
        id: project
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          just setup
          if [ "$EVENT" = pull_request ]; then
            just check
            just test
          else
            just verify
          fi
      - name: Complete source-root qualification
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: ${{ github.event_name == 'pull_request' && 'short check' || 'full check' }}
          task-type: test
          name: quality
          read-token: ${{ steps.setup.outputs.read-token }}

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
    with:
      hosted-runner: ubuntu-26.04
    permissions:
      contents: read
